version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: recruitiq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: recruitiq_db_password_123
      POSTGRES_DB: recruitiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitiq_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitiq_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:recruitiq_db_password_123@postgres:5432/recruitiq_db
      - SECRET_KEY=prod-secret-key-replace-this-in-production-environments-12345
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - GEMINI_API_KEY=mock-or-real-api-key
      - LLM_PROVIDER=gemini
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitiq_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - PORT=3000
      - HOST=0.0.0.0

volumes:
  postgres_data:
  backend_uploads:
