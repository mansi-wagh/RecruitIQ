name: RecruitIQ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # make sure test runner is installed
          pip install pytest pytest-cov httpx

      - name: Run Pytest
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test-secret-key-for-github-actions-jwt-authentication-only-1234
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          GEMINI_API_KEY: mock-api-key
          LLM_PROVIDER: gemini
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run Linter
        run: |
          cd frontend
          npm run lint --if-present

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
